name: Team Multi-Lang CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # This allows you to run it manually

jobs:
  # 🐍 PYTHON JOB (Backend)
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run Python Tests
        run: pytest || echo "No tests found yet"

  # 💙 FLUTTER & KOTLIN JOB (Mobile)
  mobile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java (Required for Kotlin/Android)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Flutter Analyze
        run: flutter analyze || echo "Analyze finished with warnings"
      - name: Run Flutter Tests
        run: flutter test || echo "No Flutter tests found yet"
